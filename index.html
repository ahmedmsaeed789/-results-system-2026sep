.save{
background:#168b45!important;

.add{

}

.result-table td,
.result-table th{
border:1px solid #c6bebe;
height:32px;
padding:5px;
text-align:center;
font-size:13px;
}

/* EXACT COLUMN ORDER */

.subject{
width:29%;
text-align:right!important;
padding-right:14px!important;
}

.space{
width:17%;
background:#eee;
}

.score{
width:9%;
}

.max{
width:9%;
}

.grade{
width:9%;
}

/* YEAR */

.year{
background:#ff6659!important;

font-size:15px!important;
height:34px!important;
}

/* TOTAL */

.total{
background:#c9bebc;
font-weight:bold;
}

.total td{
height:34px;
}

/* WEAK */

.weak{
background:#fff477!important;
}

/* ADMIN INPUT */

.edit{
width:95%;
padding:5px;
border:1px solid #888;
background:white;
text-align:center;
font-family:Tahoma,Arial;
font-size:12px;
}

.edit-subject{
width:95%;
}

.admin-button{
border:0;
padding:5px 9px;
margin:2px;
color:white;
background:#555;
}

.delete{
background:#a82222;
}

.addsubject{
background:#168b45;
}

/* FOOTER */

text-align:center;
background:#ddd;
border:1px solid #aaa;
padding:12px;
font-weight:bold;
font-size:15px;
}

.logout{

padding:9px 20px;

color:white;
border:0;
}

function showStudent(){

let html="";


results.forEach(function(stage){

html+=`

<table class="result-table">

<tr>

<td colspan="8" class="year">

${stage.name}

</td>

</tr>

`;


stage.subjects.forEach(function(s){

if(
s.grade1==="ضعيف" ||
s.grade2==="ضعيف"
){

weak="weak";

}


if(s.highlight){

weak="weak";

}


html+=`

<tr class="${weak}">

<td class="subject">
${s.name}
</td>

<td class="space"></td>

<td class="score">
${s.score1 || ""}
</td>

<td class="max">
${s.max1 || ""}
</td>

<td class="grade">
${s.grade1 || ""}
</td>

<td class="score">
${s.score2 || ""}
</td>

<td class="max">
${s.max2 || ""}
</td>

<td class="grade">
${s.grade2 || ""}
</td>

</tr>

`;

});


if(
stage.subjects.length>0 &&
stage.total
){

html+=`

<tr class="total">

<td class="subject">
المجموع الكلي
</td>

<td class="space"></td>

<td colspan="2">
${stage.total}
</td>

<td>
التقدير الكلي
</td>

<td colspan="2"></td>

<td>
${stage.totalGrade || ""}
</td>

</tr>

`;

}


html+=`

</table>

`;

});

<div class="footer">

هذه الصفحة لعرض النتيجة ولا يعمل بها كشهادة رسمية

</div>

`;


document.getElementById("studentResults").innerHTML=
html;

}

/* ==================================================
   ADD STAGE
================================================== */

function addStage(){

let name=
prompt("اكتب اسم المرحلة الجديدة");

if(!name){

return;

}


results.push({

name:name,

subjects:[]

});


showAdmin();

}


/* ==================================================
   DELETE STAGE
================================================== */

function deleteStage(index){

if(
confirm("هل تريد حذف هذه المرحلة؟")
){

results.splice(index,1);

showAdmin();

}

}

   SAVE
================================================== */

localStorage.setItem(
"resultsSystemData",
JSON.stringify(results)
);

alert("تم حفظ التعديلات بنجاح");

}

/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
