<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>النتيجة العامة لنظام الفصول</title>

<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eee;
    font-family:Tahoma,Arial,sans-serif;
    color:#111;
}

.hidden{
    display:none !important;
}


/* =========================
   LOGIN
========================= */

.login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eee;
}

.login-box{
    width:90%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:8px;
    box-shadow:0 5px 20px #aaa;
    text-align:center;
}

.login-box h1{
    color:#1d4ed8;
    margin:0 0 25px 0;
}

.login-box input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccc;
    font-size:16px;
    border-radius:3px;
}

.login-box button{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:0;
    background:#1d4ed8;
    color:white;
    font-size:17px;
    border-radius:3px;
    cursor:pointer;
}

.login-box button:active{
    transform:scale(.99);
}

#error{
    color:red;
    margin-top:10px;
    min-height:20px;
}


/* =========================
   PAGE
========================= */

.page{
    max-width:1200px;
    margin:auto;
    min-height:100vh;
    background:#eee;
}

.topbar{
    min-height:40px;
    background:linear-gradient(#596772,#252d33);
    color:white;
    font-size:20px;
    font-weight:bold;
    padding:7px 10px;
}

.student-info{
    background:#ddd;
    border:1px solid #aaa;
    padding:9px;
    font-weight:bold;
}


/* =========================
   ADMIN BAR
========================= */

.adminbar{
    background:#ddd;
    border:1px solid #aaa;
    padding:10px;
}

.adminbar button{
    border:0;
    padding:9px 14px;
    margin:3px;
    color:white;
    background:#555;
    cursor:pointer;
    border-radius:3px;
}

.save{
    background:#168b45 !important;
}

.add{
    background:#e85d4d !important;
}


/* =========================
   TABLE
========================= */

.result-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    direction:rtl;
    background:white;
}

.result-table td,
.result-table th{
    border:1px solid #c6bebe;
    height:32px;
    padding:5px;
    text-align:center;
    font-size:13px;
}


/* =========================
   COLUMNS
========================= */

.subject{
    width:29%;
    text-align:right !important;
    padding-right:14px !important;
}

.space{
    width:17%;
    background:#eee;
}

.score{
    width:9%;
}

.max{
    width:9%;
}

.grade{
    width:9%;
}


/* =========================
   YEAR
========================= */

.year{
    background:#ff6659 !important;
    font-weight:bold;
    font-size:15px !important;
    height:34px !important;
}


/* =========================
   TOTAL
========================= */

.total{
    background:#c9bebc;
    font-weight:bold;
}

.total td{
    height:34px;
}


/* =========================
   WEAK
========================= */

.weak{
    background:#fff477 !important;
}


/* =========================
   ADMIN INPUT
========================= */

.edit{
    width:95%;
    padding:5px;
    border:1px solid #888;
    background:white;
    text-align:center;
    font-family:Tahoma,Arial,sans-serif;
    font-size:12px;
    border-radius:2px;
}

.edit-subject{
    width:95%;
}

.admin-button{
    border:0;
    padding:5px 9px;
    margin:2px;
    color:white;
    background:#555;
    cursor:pointer;
    border-radius:3px;
}

.delete{
    background:#a82222;
}

.addsubject{
    background:#168b45;
}


/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    background:#ddd;
    border:1px solid #aaa;
    padding:12px;
    font-weight:bold;
    font-size:15px;
}

.logout{
    margin:15px;
    padding:9px 20px;
    background:#555;
    color:white;
    border:0;
    cursor:pointer;
    border-radius:3px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .topbar{

    }

    .edit{
        font-size:9px;
        padding:3px;
    }

}

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* ==================================================
   LOGIN
================================================== */

function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const error =
        document.getElementById("error");

    error.innerText = "";


    /* STUDENT */

    if(
        username === "student" &&
        password === "123456"
    ){

        document
            .getElementById("loginPage")
            .classList.add("hidden");

        document
            .getElementById("studentPage")
            .classList.remove("hidden");

        showStudent();

        return;
    }


    /* ADMIN */

    if(
        username === "admin" &&
        password === "admin123"
    ){

        document
            .getElementById("loginPage")
            .classList.add("hidden");

        document
            .getElementById("adminPage")
            .classList.remove("hidden");

        showAdmin();

        return;
    }


    /* WRONG LOGIN */

    error.innerText =
        "اسم المستخدم أو كلمة المرور غير صحيحة";

}


/* ==================================================
   ENTER KEY LOGIN
================================================== */

document
    .getElementById("username")
    .addEventListener("keydown", function(event){

        if(event.key === "Enter"){
            login();
        }

    });


document
    .getElementById("password")
    .addEventListener("keydown", function(event){

        if(event.key === "Enter"){
            login();
        }

    });


/* ==================================================
   STUDENT PAGE
================================================== */

function showStudent(){

    let html = "";


    results.forEach(function(stage){

        html += `

        <table class="result-table">

            <tr>

                <td
                    colspan="8"
                    class="year"
                >
                    ${escapeHTML(stage.name)}
                </td>

            </tr>

        `;


        if(
            !Array.isArray(stage.subjects)
        ){
            stage.subjects = [];
        }


        stage.subjects.forEach(function(s){

            let weak = "";


            if(
                s.grade1 === "ضعيف" ||
                s.grade2 === "ضعيف" ||
                s.highlight
            ){

                weak = "weak";

            }


            html += `

            <tr class="${weak}">

                <td class="subject">
                    ${escapeHTML(s.name)}
                </td>

                <td class="space"></td>

                <td class="score">
                    ${escapeHTML(s.score1 || "")}
                </td>

                <td class="max">
                    ${escapeHTML(s.max1 || "")}
                </td>

                <td class="grade">
                    ${escapeHTML(s.grade1 || "")}
                </td>

                <td class="score">
                    ${escapeHTML(s.score2 || "")}
                </td>

                <td class="max">
                    ${escapeHTML(s.max2 || "")}
                </td>

                <td class="grade">
                    ${escapeHTML(s.grade2 || "")}
                </td>

            </tr>

            `;

        });


        if(
            stage.subjects.length > 0 &&
            stage.total
        ){

            html += `

            <tr class="total">

                <td class="subject">
                    المجموع الكلي
                </td>

                <td class="space"></td>

                <td colspan="2">
                    ${escapeHTML(stage.total)}
                </td>

                <td>
                    التقدير الكلي
                </td>

                <td colspan="2"></td>

                <td>
                    ${escapeHTML(stage.totalGrade || "")}
                </td>

            </tr>

            `;

        }


        html += `

        </table>

        `;

    });


    html += `

    <div class="footer">

        هذه الصفحة لعرض النتيجة
        ولا يعمل بها كشهادة رسمية

    </div>

    `;


    document
        .getElementById("studentResults")
        .innerHTML = html;

}


/* ==================================================
   ADMIN PAGE
================================================== */

function showAdmin(){

    let html = "";


    results.forEach(function(stage, si){

        if(!Array.isArray(stage.subjects)){
            stage.subjects = [];
        }


        html += `

        <table class="result-table">

            <tr>

                <td
                    colspan="8"
                    class="year"
                >

                    <input
                        class="edit"
                        value="${escapeHTML(stage.name)}"
                        onchange="updateStageName(${si}, this.value)"
                    >

                </td>

            </tr>

        `;


        stage.subjects.forEach(function(s, ri){

            let weak = "";


            if(
                s.grade1 === "ضعيف" ||
                s.grade2 === "ضعيف" ||
                s.highlight
            ){

                weak = "weak";

            }


            html += `

            <tr class="${weak}">

                <td class="subject">

                    <input
                        class="edit edit-subject"
                        value="${escapeHTML(s.name)}"
                        onchange="updateSubject(${si},${ri},'name',this.value)"
                    >

                </td>

                <td class="space"></td>


                <td>

                    <input
                        class="edit"
                        value="${escapeHTML(s.score1 || "")}"
                        onchange="updateSubject(${si},${ri},'score1',this.value)"
                    >

                </td>


                <td>

                    <input
                        class="edit"
                        value="${escapeHTML(s.max1 || "")}"
                        onchange="updateSubject(${si},${ri},'max1',this.value)"
                    >

                </td>


                <td>

                    <input
                        class="edit"
                        value="${escapeHTML(s.grade1 || "")}"
                        onchange="updateSubject(${si},${ri},'grade1',this.value)"
                    >

                </td>


                <td>

                    <input
                        class="edit"
                        value="${escapeHTML(s.score2 || "")}"
                        onchange="updateSubject(${si},${ri},'score2',this.value)"
                    >

                </td>


                <td>

                    <input
                        class="edit"
                        value="${escapeHTML(s.max2 || "")}"
                        onchange="updateSubject(${si},${ri},'max2',this.value)"
                    >

                </td>


                <td>

                    <input
                        class="edit"
                        value="${escapeHTML(s.grade2 || "")}"
                        onchange="updateSubject(${si},${ri},'grade2',this.value)"
                    >

                </td>

            </tr>

            `;

        });


        html += `

        <tr>

            <td colspan="8">

                <button
                    class="admin-button addsubject"
                    type="button"
                    onclick="addSubject(${si})"
                >
                    + إضافة مادة
                </button>


                <button
                    class="admin-button delete"
                    type="button"
                    onclick="deleteStage(${si})"
                >
                    حذف المرحلة
                </button>

            </td>

        </tr>

        </table>

        `;

    });


    document
        .getElementById("adminResults")
        .innerHTML = html;

}


/* ==================================================
   UPDATE STAGE NAME
================================================== */

function updateStageName(index, value){

    if(results[index]){

        results[index].name = value;

    }

}


/* ==================================================
   UPDATE SUBJECT
================================================== */

function updateSubject(
    stageIndex,
    subjectIndex,
    field,
    value
){

    if(
        results[stageIndex] &&
        results[stageIndex].subjects[subjectIndex]
    ){

        results[stageIndex]
            .subjects[subjectIndex][field] = value;

    }

}


/* ==================================================
   ADD SUBJECT
================================================== */

function addSubject(stageIndex){

    if(!results[stageIndex]){
        return;
    }


    if(!Array.isArray(results[stageIndex].subjects)){
        results[stageIndex].subjects = [];
    }


    results[stageIndex].subjects.push({

        name:"مادة جديدة",

        score1:"",
        max1:"",
        grade1:"",

        score2:"",
        max2:"",
        grade2:""

    });


    showAdmin();

}


/* ==================================================
   ADD STAGE
================================================== */

function addStage(){

    const name =
        prompt("اكتب اسم المرحلة الجديدة");


    if(!name || !name.trim()){
        return;
    }


    results.push({

        name:name.trim(),

        subjects:[]

    });


    showAdmin();

}


/* ==================================================
   DELETE STAGE
================================================== */

function deleteStage(index){

    if(
        !confirm("هل تريد حذف هذه المرحلة؟")
    ){

        return;

    }


    results.splice(index,1);

    showAdmin();

}


/* ==================================================
   SAVE DATA
================================================== */

function saveData(){

    try{

        localStorage.setItem(
            "resultsSystemData",
            JSON.stringify(results)
        );

        alert("تم حفظ التعديلات بنجاح");

    }catch(error){

        alert("حدث خطأ أثناء حفظ البيانات");

        console.error(error);

    }

}


/* ==================================================
   LOGOUT
================================================== */

function logout(){

    location.reload();

}

</script>

</html>
