<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نظام النتائج</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: white;
      width: 85%;
      max-width: 400px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      color: #1d4ed8;
      margin-bottom: 25px;
    }

    input {
      width: 90%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      text-align: right;
    }

    button {
      width: 98%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #1d4ed8;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1741b5;
    }

    #result {
      display: none;
    }

    .success {
      color: green;
      font-size: 20px;
      font-weight: bold;
    }

    .mark {
      font-size: 40px;
      color: #1d4ed8;
      font-weight: bold;
      margin: 20px;
    }
  </style>
</head>

<body>

  <div class="box" id="login">

    <h1>نظام النتائج</h1>

    <input
      type="text"
      id="username"
      placeholder="اسم المستخدم"
    >

    <input
      type="password"
      id="password"
      placeholder="كلمة المرور"
    >

    <button onclick="login()">
      تسجيل الدخول
    </button>

    <p id="error" style="color:red;"></p>

  </div>


  <div class="box" id="result">

    <h1>نتيجتك</h1>

    <p>أهلاً بك</p>

    <p class="success">تم تسجيل الدخول بنجاح</p>

    <p>النتيجة النهائية</p>

    <div class="mark">85 / 100</div>

    <p>مبروك 🎉</p>

  </div>


<script>

function login() {

  var username = document.getElementById("username").value;
  var password = document.getElementById("password").value;

  if (username === "student" && password === "123456") {

    document.getElementById("login").style.display = "none";
    document.getElementById("result").style.display = "block";

  } else {

    document.getElementById("error").innerText =
      "اسم المستخدم أو كلمة المرور غير صحيحة";

  }
}

</script>

</body>
</html>
